<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Nabha Telemedicine</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card auth-card-large">
            <div class="auth-header">
                <img src="assets/images/logo.png" alt="Nabha Telemedicine" class="auth-logo">
                <h1>Doctor Registration</h1>
                <p>Join our healthcare network to serve rural communities</p>
            </div>
            
            <form id="doctorRegisterForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required 
                               placeholder="Enter first name">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required 
                               placeholder="Enter last name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="doctor@example.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required 
                               placeholder="+91 9876543210">
                    </div>
                    <div class="form-group">
                        <label for="licenseNumber">Medical License</label>
                        <input type="text" id="licenseNumber" name="licenseNumber" required 
                               placeholder="Medical License Number">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <select id="specialization" name="specialization" required>
                            <option value="">Select Specialization</option>
                            <option value="general">General Medicine</option>
                            <option value="pediatrics">Pediatrics</option>
                            <option value="gynecology">Gynecology</option>
                            <option value="cardiology">Cardiology</option>
                            <option value="dermatology">Dermatology</option>
                            <option value="psychiatry">Psychiatry</option>
                            <option value="orthopedics">Orthopedics</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="experience">Years of Experience</label>
                        <input type="number" id="experience" name="experience" required 
                               placeholder="5" min="1" max="50">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hospital">Hospital/Clinic Affiliation</label>
                    <input type="text" id="hospital" name="hospital" required 
                           placeholder="Hospital or Clinic Name">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Create strong password" minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               placeholder="Confirm password">
                    </div>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Register as Doctor</span>
                    <span class="btn-loader" style="display: none;">Creating account...</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="doctor-login.html">Sign In</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('doctorRegisterForm');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            
            // Password confirmation validation
            confirmPassword.addEventListener('input', function() {
                if (password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Passwords do not match');
                } else {
                    confirmPassword.setCustomValidity('');
                }
            });
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (password.value !== confirmPassword.value) {
                    showError('Passwords do not match');
                    return;
                }
                
                const formData = {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    licenseNumber: document.getElementById('licenseNumber').value,
                    specialization: document.getElementById('specialization').value,
                    experience: parseInt(document.getElementById('experience').value),
                    hospital: document.getElementById('hospital').value,
                    password: password.value
                };
                
                await registerDoctor(formData);
            });
        });
    </script>
</body>
</html>
