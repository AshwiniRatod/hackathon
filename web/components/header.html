<!-- Header Component for Nabha Telemedicine Dashboard -->
<header class="header">
    <div class="header-left">
        <button class="header-toggle" id="sidebarToggle">
            <span>☰</span>
        </button>
        <h1 class="header-title" id="pageTitle">Dashboard</h1>
    </div>
    
    <div class="header-right">
        <!-- Connection Status -->
        <div id="connection-status" class="connection-status disconnected">
            Connecting...
        </div>
        
        <!-- Notifications -->
        <button class="notification-btn" id="notificationBtn">
            <span>🔔</span>
            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </button>
        
        <!-- User Menu -->
        <div class="user-menu">
            <div class="user-avatar" id="userAvatar" onclick="toggleUserDropdown()">
                <span id="userInitials">U</span>
            </div>
            
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info">
                    <strong id="userName">User Name</strong>
                    <span id="userEmail">user@example.com</span>
                    <span class="user-role" id="userRole">Role</span>
                </div>
                
                <div class="dropdown-divider"></div>
                
                <a href="#" class="dropdown-item" onclick="viewProfile()">
                    <span>👤</span> Profile
                </a>
                
                <a href="#" class="dropdown-item" onclick="openSettings()">
                    <span>⚙️</span> Settings
                </a>
                
                <div class="dropdown-divider"></div>
                
                <button class="dropdown-item" onclick="logoutUser()">
                    <span>🚪</span> Logout
                </button>
            </div>
        </div>
    </div>
</header>

<script>
// Header component JavaScript
(function() {
    let notificationCount = 0;
    let userDropdownOpen = false;
    
    // Initialize header when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        initializeHeader();
        setupHeaderEventListeners();
        loadUserInfo();
        updatePageTitle();
    });
    
    function initializeHeader() {
        // Setup sidebar toggle
        const sidebarToggle = document.getElementById('sidebarToggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }
        
        // Setup notification button
        const notificationBtn = document.getElementById('notificationBtn');
        if (notificationBtn) {
            notificationBtn.addEventListener('click', toggleNotifications);
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const userMenu = document.querySelector('.user-menu');
            if (userMenu && !userMenu.contains(e.target)) {
                closeUserDropdown();
            }
        });
    }
    
    function setupHeaderEventListeners() {
        // Listen for WebSocket events to update notifications
        if (window.WebSocketModule) {
            WebSocketModule.on('sosAlert', function(data) {
                incrementNotificationCount();
                showNotificationBadge();
            });
            
            WebSocketModule.on('consultationRequest', function(data) {
                incrementNotificationCount();
                showNotificationBadge();
            });
            
            WebSocketModule.on('ashaReport', function(data) {
                incrementNotificationCount();
                showNotificationBadge();
            });
            
            WebSocketModule.on('notification', function(data) {
                incrementNotificationCount();
                showNotificationBadge();
            });
        }
    }
    
    function loadUserInfo() {
        const userData = AuthModule.getUserData();
        if (userData) {
            // Update user name
            const userName = document.getElementById('userName');
            if (userName) {
                userName.textContent = userData.firstName ? 
                    `${userData.firstName} ${userData.lastName}` : 
                    userData.name || 'User';
            }
            
            // Update user email
            const userEmail = document.getElementById('userEmail');
            if (userEmail) {
                userEmail.textContent = userData.email;
            }
            
            // Update user role
            const userRole = document.getElementById('userRole');
            if (userRole) {
                userRole.textContent = userData.role.charAt(0).toUpperCase() + userData.role.slice(1);
            }
            
            // Update user initials
            const userInitials = document.getElementById('userInitials');
            if (userInitials) {
                const initials = userData.firstName && userData.lastName ? 
                    userData.firstName.charAt(0) + userData.lastName.charAt(0) :
                    userData.name ? userData.name.charAt(0) :
                    userData.email.charAt(0);
                userInitials.textContent = initials.toUpperCase();
            }
        }
    }
    
    function updatePageTitle() {
        const pageTitle = document.getElementById('pageTitle');
        if (pageTitle) {
            const path = window.location.pathname;
            let title = 'Dashboard';
            
            if (path.includes('admin-dashboard')) {
                title = 'Admin Dashboard';
            } else if (path.includes('doctor-dashboard')) {
                title = 'Doctor Dashboard';
            } else if (path.includes('patients')) {
                title = 'Patients';
            } else if (path.includes('consultations')) {
                title = 'Consultations';
            } else if (path.includes('prescriptions')) {
                title = 'Prescriptions';
            } else if (path.includes('reports')) {
                title = 'Reports';
            } else if (path.includes('settings')) {
                title = 'Settings';
            }
            
            pageTitle.textContent = title;
            document.title = `${title} - Nabha Telemedicine`;
        }
    }
    
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
            sidebar.classList.toggle('show');
        }
    }
    
    function toggleNotifications() {
        // Open notifications panel/modal
        openNotificationsModal();
        
        // Reset notification count
        resetNotificationCount();
    }
    
    function incrementNotificationCount() {
        notificationCount++;
        updateNotificationBadge();
    }
    
    function resetNotificationCount() {
        notificationCount = 0;
        updateNotificationBadge();
        hideNotificationBadge();
    }
    
    function updateNotificationBadge() {
        const badge = document.getElementById('notificationBadge');
        if (badge) {
            badge.textContent = notificationCount;
        }
    }
    
    function showNotificationBadge() {
        const badge = document.getElementById('notificationBadge');
        if (badge) {
            badge.style.display = 'block';
        }
    }
    
    function hideNotificationBadge() {
        const badge = document.getElementById('notificationBadge');
        if (badge) {
            badge.style.display = 'none';
        }
    }
    
    function openNotificationsModal() {
        // Implementation for notifications modal
        if (window.openModal) {
            window.openModal('notificationsModal');
        }
    }
    
    // Global functions for dropdown
    window.toggleUserDropdown = function() {
        const dropdown = document.getElementById('userDropdown');
        if (dropdown) {
            userDropdownOpen = !userDropdownOpen;
            dropdown.classList.toggle('show', userDropdownOpen);
        }
    };
    
    function closeUserDropdown() {
        const dropdown = document.getElementById('userDropdown');
        if (dropdown && userDropdownOpen) {
            userDropdownOpen = false;
            dropdown.classList.remove('show');
        }
    }
    
    window.viewProfile = function() {
        closeUserDropdown();
        // Navigate to profile page
        window.location.href = '#profile';
    };
    
    window.openSettings = function() {
        closeUserDropdown();
        // Open settings modal
        if (window.openModal) {
            window.openModal('settingsModal');
        }
    };
    
    // Update notification count periodically
    setInterval(function() {
        if (window.WebSocketModule && WebSocketModule.isConnected()) {
            // The badge will be updated through WebSocket events
        }
    }, 30000); // Check every 30 seconds
    
})();
</script>

<style>
/* Header Component Styles */
.connection-status {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    margin-right: 12px;
}

.connection-status.connected {
    background: #dcfce7;
    color: #16a34a;
}

.connection-status.disconnected {
    background: #fecaca;
    color: #dc2626;
}

.user-info {
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray-200);
}

.user-info strong {
    display: block;
    margin-bottom: 4px;
}

.user-info span {
    display: block;
    font-size: 12px;
    color: var(--gray-500);
}

.user-role {
    background: var(--primary-blue);
    color: white;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    display: inline-block !important;
    margin-top: 4px;
}

@media (max-width: 768px) {
    .header-title {
        font-size: 16px;
    }
    
    .connection-status {
        display: none;
    }
}
</style>
